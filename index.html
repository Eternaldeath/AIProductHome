<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Product Home</title>
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="images/logos/favicon.png"
    />
    <link rel="shortcut icon" href="images/logos/favicon.png" />
    <link rel="apple-touch-icon" href="images/logos/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }

      :root {
        /* ===== 颜色:主色调 ===== */
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8; /* 新增:按钮/链接 hover 加深 */
        --primary-ring: rgba(37, 99, 235, 0.1); /* 新增:focus 光圈 */
        --primary-tint: rgba(37, 99, 235, 0.05); /* 新增:浅色高亮底 */
        --secondary-color: #7c3aed;

        /* ===== 颜色:中性表面 ===== */
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --surface-subtle: #f8fafc; /* 新增:tool-model / subcategory 底 */
        --surface-hover: #f1f5f9; /* 新增:分类标签默认底 */
        --surface-active: #e0e7ff; /* 新增:分类标签 hover 底 */
        --border-color: #e2e8f0;
        --disabled-bg: #94a3b8; /* 新增:禁用按钮 */

        /* ===== 颜色:文字 ===== */
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-muted: #cbd5e1; /* 新增:空状态图标等弱化文字 */
        --text-on-primary: #ffffff; /* 新增:主色上的文字(替代 white 关键字) */

        /* ===== 阴影 ===== */
        --shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-hover: 0 10px 20px rgba(0, 0, 0, 0.1); /* 新增 */

        /* ===== 圆角 ===== */
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 12px; /* 原 --radius */
        --radius: var(--radius-lg);
        --radius-xl: 20px;
        --radius-pill: 50px;

        /* ===== 过渡 ===== */
        --transition: all 0.3s ease;

        /* 徽章配色 */
        --badge-free-bg: #d1fae5;
        --badge-free-fg: #065f46;
        --badge-paid-bg: #fee2e2;
        --badge-paid-fg: #991b1b;
        --badge-test-bg: #fef3c7;
        --badge-test-fg: #92400e;
        --badge-open-bg: #dbeafe;
        --badge-open-fg: #1e40af;
        --badge-plugin-bg: #f3e8ff;
        --badge-plugin-fg: #6b21a8;
        --badge-vpn-bg: #fce7f3;
        --badge-vpn-fg: #9d174d;
        --badge-paper-bg: #e0f2fe;
        --badge-paper-fg: #075985;

        /* ===== 分享者标签 ===== */
        --sharer-color: #7c3aed; /* 分享者主色（violet） */
        --sharer-tint: rgba(124, 58, 237, 0.08); /* hover 底色 */
        --sharer-ring: rgba(124, 58, 237, 0.45); /* 焦点环 */

        /* ===== 精选推荐（橘黄） ===== */
        --featured-color: #f59e0b; /* 橘黄主色 */
        --featured-hover: #d97706; /* hover 加深 */
        --featured-deep: #b45309; /* 深橘文字 */
        --featured-bg: #fff7ed; /* 区块奶油底 */
        --featured-surface: #ffffff; /* 卡片底 */
        --featured-border: #f59e0b; /* 区块/卡片描边 */
        --featured-tint: rgba(245, 158, 11, 0.1); /* 浅色高亮底 */
        --featured-ring: rgba(245, 158, 11, 0.45); /* 焦点环 */
        --featured-on: #ffffff; /* 橘色底上的文字 */

        /* ===== 赞助商卡片 / 二维码弹窗（双主题一致） ===== */
        --wechat-green: #07c160; /* 微信品牌绿 */
        --sponsor-divider: rgba(255, 255, 255, 0.35); /* 渐变卡上的分隔线 */
        --qr-overlay: rgba(0, 0, 0, 0.55); /* 弹窗遮罩 */
        --qr-img-bg: #ffffff; /* 二维码白底，保证可扫 */
      }

      /* ===== 深色主题：独立页面，挂在 html[data-theme] 上 ===== */
      html[data-theme="dark"] {
        /* 中性表面 */
        --bg-color: #0f172a; /* slate-900 */
        --card-bg: #1e293b; /* slate-800 */
        --surface-subtle: #1e293b;
        --surface-hover: #334155; /* slate-700 */
        --surface-active: #3730a3;
        --border-color: #334155;
        --disabled-bg: #475569;

        /* 文字 */
        --text-primary: #e2e8f0; /* slate-200 */
        --text-secondary: #94a3b8; /* slate-400 */
        --text-muted: #475569;

        /* 主色提亮，保证深底对比度 */
        --primary-color: #3b82f6;
        --primary-hover: #60a5fa;
        --primary-ring: rgba(59, 130, 246, 0.35);
        --primary-tint: rgba(59, 130, 246, 0.12);

        /* 阴影加深 */
        --shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.4);
        --shadow-hover: 0 10px 20px rgba(0, 0, 0, 0.6);

        /* 徽章：深底 + 亮字 */
        --badge-free-bg: #064e3b;
        --badge-free-fg: #6ee7b7;
        --badge-paid-bg: #7f1d1d;
        --badge-paid-fg: #fca5a5;
        --badge-test-bg: #78350f;
        --badge-test-fg: #fcd34d;
        --badge-open-bg: #1e3a8a;
        --badge-open-fg: #93c5fd;
        --badge-plugin-bg: #4c1d95;
        --badge-plugin-fg: #c4b5fd;
        --badge-vpn-bg: #831843;
        --badge-vpn-fg: #f9a8d4;
        --badge-paper-bg: #0c4a6e;
        --badge-paper-fg: #7dd3fc;

        /* 分享者标签：深底提亮保证对比度 */
        --sharer-color: #c4b5fd;
        --sharer-tint: rgba(196, 181, 253, 0.12);
        --sharer-ring: rgba(196, 181, 253, 0.45);

        /* 精选推荐：深底换暖棕系，亮字保证对比度 */
        --featured-color: #fbbf24; /* amber-400，提亮 */
        --featured-hover: #fcd34d;
        --featured-deep: #fcd34d; /* 深色底上用亮黄文字 */
        --featured-bg: #2a1503; /* 深棕奶油底 */
        --featured-surface: #341c06; /* 卡片底 */
        --featured-border: #b45309; /* amber-700 描边 */
        --featured-tint: rgba(251, 191, 36, 0.12);
        --featured-ring: rgba(251, 191, 36, 0.45);
        --featured-on: #451a03; /* 亮黄底上的深棕文字 */

        /* 原生控件 / 滚动条 / 焦点框自动适配深色 */
        color-scheme: dark;
      }

      /* 浅色模式显式声明，避免浏览器「强制深色」干扰 */
      :root {
        color-scheme: light;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        padding-bottom: 60px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* 头部样式 */
      .header {
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        color: var(--text-on-primary);
        padding: 40px 0;
        margin-bottom: 40px;
        text-align: center;
        border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        box-shadow: var(--shadow);
        position: relative;
      }

      .header h1 {
        font-size: 2.8rem;
        margin-bottom: 12px;
        font-weight: 800;
      }

      .header p {
        font-size: 1.2rem;
        opacity: 0.9;
        max-width: 800px;
        margin: 0 auto;
      }

      /* 头部右上角操作区（推荐产品 + 主题切换） */
      .header-actions {
        position: absolute;
        top: 16px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* 主题切换按钮 */
      .theme-toggle {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--transition);
      }

      .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* 图标：默认显月亮，深色显太阳 */
      .theme-toggle .icon-sun {
        display: none;
      }
      html[data-theme="dark"] .theme-toggle .icon-moon {
        display: none;
      }
      html[data-theme="dark"] .theme-toggle .icon-sun {
        display: inline-block;
      }

      .recommend-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: var(--radius-pill);
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: var(--transition);
      }

      .recommend-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        color: #fff;
      }

      /* GitHub 仓库按钮（圆形图标钮，与主题切换同尺寸/外形） */
      .github-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 1.1rem;
        text-decoration: none;
        cursor: pointer;
        transition: var(--transition);
      }

      .github-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        color: #fff;
      }

      /* 键盘焦点可见（两个按钮统一） */
      .theme-toggle:focus-visible,
      .recommend-btn:focus-visible,
      .github-btn:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.75);
        outline-offset: 2px;
      }

      /* 分类导航 */
      .category-nav {
        background-color: var(--card-bg);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: var(--shadow);
      }

      .category-nav h2 {
        font-size: 1.4rem;
        margin-bottom: 15px;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .category-nav h2 i {
        font-size: 1.2rem;
      }

      .category-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .category-tag {
        background-color: var(--surface-hover);
        color: var(--text-primary);
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        font-size: 0.9rem;
        cursor: pointer;
        transition: var(--transition);
        border: 1px solid transparent;
      }

      .category-tag:hover {
        background-color: var(--surface-active);
        color: var(--primary-color);
        transform: translateY(-2px);
      }

      .category-tag.active {
        background-color: var(--primary-color);
        color: var(--text-on-primary);
        font-weight: 600;
      }

      /* 工具卡片网格 */
      .tools-section {
        margin-bottom: 50px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--border-color);
      }

      .section-title {
        font-size: 1.8rem;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title i {
        font-size: 1.4rem;
      }

      .tools-count {
        background-color: var(--primary-color);
        color: var(--text-on-primary);
        padding: 4px 12px;
        border-radius: var(--radius-xl);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
      }

      /* 工具卡片 */
      .tool-card {
        background-color: var(--card-bg);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
        transition: var(--transition);
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .tool-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        border-color: var(--primary-color);
      }

      .tool-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .tool-name {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .tool-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .badge {
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .badge i {
        font-size: 0.9em; /* 图标略小于文字，视觉更协调 */
        line-height: 1;
      }

      .badge.free {
        background-color: var(--badge-free-bg);
        color: var(--badge-free-fg);
      }

      .badge.paid {
        background-color: var(--badge-paid-bg);
        color: var(--badge-paid-fg);
      }

      .badge.test {
        background-color: var(--badge-test-bg);
        color: var(--badge-test-fg);
      }

      .badge.open-source {
        background-color: var(--badge-open-bg);
        color: var(--badge-open-fg);
      }

      .badge.plugin {
        background-color: var(--badge-plugin-bg);
        color: var(--badge-plugin-fg);
      }

      .badge.vpn {
        background-color: var(--badge-vpn-bg);
        color: var(--badge-vpn-fg);
      }

      .badge.paper {
        background-color: var(--badge-paper-bg);
        color: var(--badge-paper-fg);
      }

      .tool-description {
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 20px;
        flex-grow: 1;
      }

      .tool-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--border-color);
      }

      .tool-model {
        font-size: 0.9rem;
        color: var(--text-secondary);
        background-color: var(--surface-subtle);
        padding: 4px 10px;
        border-radius: var(--radius-sm);
      }

      /* 分享者标签：描述与底部操作区之间的胶囊 chip */
      .tool-sharer {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
        padding: 4px 12px;
        border-radius: var(--radius-pill);
        background-color: var(--surface-subtle);
        border: 1px solid var(--sharer-color);
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--sharer-color);
        width: fit-content;
        max-width: 100%;
      }

      .tool-sharer i {
        font-size: 0.85em; /* 图标略小于文字，与 .badge 一致 */
        line-height: 1;
      }

      .tool-sharer-label {
        color: var(--text-secondary);
        font-weight: 500;
      }

      .tool-sharer a {
        color: var(--sharer-color);
        text-decoration: none;
        padding: 0 2px;
        transition: all 0.2s ease;
      }

      .tool-sharer a:hover {
        background-color: var(--sharer-tint);
      }

      .tool-sharer a:focus-visible {
        outline: 3px solid var(--sharer-ring);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      .tool-sharer strong {
        color: var(--sharer-color);
      }

      /* ===== 精选推荐：导航标签（橘黄 + 皇冠） ===== */
      .category-tag.featured-tag {
        background-color: var(--featured-tint);
        color: var(--featured-deep);
        border: 1px solid var(--featured-color);
        font-weight: 600;
      }

      .category-tag.featured-tag:hover {
        background-color: var(--featured-color);
        color: var(--featured-on);
      }

      .category-tag.featured-tag.active {
        background-color: var(--featured-color);
        color: var(--featured-on);
      }

      .category-tag.featured-tag i {
        margin-right: 4px;
        font-size: 0.85em;
      }

      /* ===== 精选推荐：区块容器（奶油底 + 橘黄描边） ===== */
      .tools-section.featured-section {
        background: linear-gradient(
          135deg,
          var(--featured-bg),
          var(--featured-surface)
        );
        border: 2px solid var(--featured-border);
        border-radius: var(--radius-xl);
        padding: 24px;
        margin-bottom: 50px;
        box-shadow: var(--shadow);
      }

      .featured-section .section-header {
        border-bottom: 1px solid var(--featured-tint);
      }

      .featured-section .section-title {
        color: var(--featured-deep);
      }

      .featured-section .section-title i {
        color: var(--featured-color);
      }

      .featured-section .tools-count {
        background-color: var(--featured-color);
        color: var(--featured-on);
      }

      /* ===== 精选推荐：卡片特化（沿用 .tool-card 结构，仅配色） ===== */
      .tool-card.featured {
        background-color: var(--featured-surface);
        border: 1px solid var(--featured-border);
      }

      .tool-card.featured:hover {
        border-color: var(--featured-hover);
        box-shadow: 0 10px 20px var(--featured-tint);
      }

      .tool-card.featured .tool-name {
        color: var(--featured-deep);
      }

      .featured-pill {
        background-color: var(--featured-color);
        color: var(--featured-on);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* 精选卡片的「访问」按钮走橘黄 */
      .tool-card.featured .tool-link {
        background-color: var(--featured-color);
      }

      .tool-card.featured .tool-link:hover {
        background-color: var(--featured-hover);
      }

      .tool-card.featured .tool-link:focus-visible {
        outline: 3px solid var(--featured-ring);
        outline-offset: 2px;
      }

      /* ===== 赞助商招租卡片（橘黄渐变，沿用 .tool-card 骨架） ===== */
      .tool-card.sponsor-card {
        background: linear-gradient(
          135deg,
          var(--featured-color),
          var(--featured-hover)
        );
        border: 1px solid var(--featured-border);
        justify-content: flex-start;
        gap: 12px;
      }

      .tool-card.sponsor-card:hover {
        box-shadow: 0 10px 20px var(--featured-tint);
        transform: translateY(-6px);
      }

      .sponsor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .sponsor-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--featured-on);
      }

      .sponsor-tag {
        background-color: var(--featured-on);
        color: var(--featured-color);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .sponsor-desc {
        color: var(--featured-on);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
        flex-grow: 1;
        opacity: 0.92;
      }

      /* 卡片底色即橘黄渐变，footer 分隔线换半透明白 */
      .sponsor-card .tool-footer {
        border-top: 1px solid var(--sponsor-divider);
      }

      .sponsor-contact-btn {
        background-color: var(--featured-on);
        color: var(--featured-color);
        border: none;
        padding: 8px 16px;
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: var(--transition);
      }

      .sponsor-contact-btn:hover {

  <body>
    <div class="header">

    <script>
      // Markdown解析器
      class MarkdownToUI {
        constructor() {
          this.categories = [];
          this.allTools = [];
          this.filteredTools = [];
          this.currentCategory = "all";
          this.searchTerm = "";
        }

        getSafeId(text) {
          // 1. 将中文字符等先编码，避免乱码问题（可选但更健壮）
          // 2. 替换所有非字母、数字、连字符、下划线的字符为连字符
          // 正则表达式解释：
          // [^\w\-] 匹配任何不是 字母、数字、下划线(_)、连字符(-) 的字符
          // /g 表示全局替换
          let safeId = text.replace(/[^\w\u4e00-\u9fa5\-]/g, "-"); // 此版本允许保留中文

          // 或者更严格地，只保留英文、数字、连字符：
          // let safeId = text.replace(/[^a-zA-Z0-9\-]/g, '-');

          // 3. 处理多个连续的连字符，将其替换为单个
          safeId = safeId.replace(/-+/g, "-");

          // 4. 确保不以连字符开头或结尾（某些浏览器中可能有问题）
          safeId = safeId.replace(/^-+/, "").replace(/-+$/, "");

          return `grid-${safeId}`;
        }

        // 是否为精选推荐分类
        isFeaturedCategory(categoryName) {
          return (categoryName || "").includes("精选推荐");
        }

        // 是否为赞助商招租占位（精选推荐栏目中的无链接"赞助商"行）
        isSponsorSlot(tool) {
          return (
            this.isFeaturedCategory(tool.category) &&
            tool.name === "赞助商" &&
            !tool.link
          );
        }

        // 解析Markdown内容
        parseMarkdown(markdownContent) {
          // 分割行
          const lines = markdownContent.split("\n");
          let currentCategory = null;
          let inTable = false;
          let tableHeaders = [];
          let tableRows = [];

          // 查找解析起点：优先"精选推荐"栏目，回退"搜索引擎"
          let startIndex = 0;
          let featuredIndex = -1;
          let searchIndex = -1;
          for (let i = 0; i < lines.length; i++) {
            const l = lines[i].trim();
            if (
              featuredIndex === -1 &&
              l.startsWith("# ") &&
              l.includes("精选推荐")
            ) {
              featuredIndex = i;
            }
            if (searchIndex === -1 && l.startsWith("# 搜索引擎")) {
              searchIndex = i;
            }
          }
          if (featuredIndex !== -1) {
            startIndex = featuredIndex;
          } else if (searchIndex !== -1) {
            startIndex = searchIndex;
          }

          let currentMainCategory = ""; // 当前一级分类
          let currentSubCategory = ""; // 当前二级分类
          let currentCombinedCategory = ""; // 合并分类

          // 从起点开始解析
          for (let i = startIndex; i < lines.length; i++) {
            const line = lines[i].trim();

            // 检查是否为一级标题（新的分类）
            if (line.startsWith("# ") && !line.startsWith("##")) {
              // 保存前一个分类的数据
              if (tableRows.length > 0) {
                this.processTable(
                  currentCombinedCategory,
                  tableHeaders,
                  tableRows,
                );
              }

              // 开始新的分类
              currentMainCategory = line.substring(2).trim();
              currentSubCategory = ""; // 重置二级分类
              currentCombinedCategory = currentMainCategory; // 初始组合名就是一级分类名
              inTable = false;
              tableHeaders = [];
              tableRows = [];
              continue;
            }
            // 处理二级标题
            if (line.startsWith("## ")) {
              // 保存上一次的二级标题分类
              if (tableRows.length > 0) {
                this.processTable(
                  currentCombinedCategory,
                  tableHeaders,
                  tableRows,
                );
                tableRows = []; // 重置行数据
              }
              currentSubCategory = line.substring(3).trim();
              currentCombinedCategory = `${currentMainCategory} - ${currentSubCategory}`;
              continue;
            }

            // 检查是否为表格开始
            if (line.startsWith("|") && line.includes("|", 1)) {
              if (!inTable) {
                inTable = true;
                tableRows = [];
              }

              // 解析表格行
              const cells = line
                .split("|")
                .map((cell) => cell.trim())
                .filter((cell) => cell.length > 0);

              // 检查是否为表头分隔行（只包含-和:的行）
              const isSeparator = cells.every((cell) => {
                // 检查单元格是否只包含连字符-、冒号:和空格
                return /^[\s:-]+$/.test(cell);
              });

              if (isSeparator) {
                continue; // 跳过表头分隔行
              }

              // 如果是第一行，可能是表头
              if (tableRows.length === 0 && !tableHeaders.length) {
                tableHeaders = cells;
              } else {
                tableRows.push(cells);
              }
            } else if (inTable) {
              // 表格结束
              if (tableRows.length > 0) {
                this.processTable(
                  currentCombinedCategory,
                  tableHeaders,
                  tableRows,
                );
              }
              inTable = false;
              tableHeaders = [];
              tableRows = [];
            }
          }

          // 处理最后一个表格
          if (currentCategory && tableRows.length > 0) {
            this.processTable(currentCategory, tableHeaders, tableRows);
          }

          console.log(
            `解析完成，共找到 ${this.categories.length} 个分类，${this.allTools.length} 个工具`,
          );
        }

        // 检查是否为表格分隔行
        isTableSeparator(cell) {
          // 表格分隔行通常只包含连字符-和冒号:
          // 例如: "---", ":---", ":---:", "---:"
          return /^[: -]+$/.test(cell);
        }

        // 处理表格数据
        processTable(categoryName, headers, rows) {
          // 根据表头确定列映射
          const colMap = {};
          headers.forEach((header, index) => {
            colMap[header] = index;
          });

          // 确定工具名称和描述的列索引
          let nameColIndex = 0;
          let descColIndex = headers.length - 1; // 默认最后一列为描述

          // 尝试找到更合适的列
          if (colMap["产品名称"] !== undefined) {
            nameColIndex = colMap["产品名称"];
          } else if (colMap["产品名称 "] !== undefined) {
            nameColIndex = colMap["产品名称 "];
          }

          if (colMap["备注"] !== undefined) {
            descColIndex = colMap["备注"];
          }

          // 提取基础模型列（如果存在）
          let modelColIndex = -1;
          if (colMap["基础模型"] !== undefined) {
            modelColIndex = colMap["基础模型"];
          } else if (colMap["底层模型"] !== undefined) {
            modelColIndex = colMap["底层模型"];
          }

          // 提取相关信息列（如果存在）
          let infoColIndex = -1;
          if (colMap["相关信息"] !== undefined) {
            infoColIndex = colMap["相关信息"];
          }

          // 处理每一行
          const categoryTools = [];
          rows.forEach((row) => {
            if (row.length <= nameColIndex) return;

            const toolName = row[nameColIndex];
            let toolDesc = descColIndex < row.length ? row[descColIndex] : "";

            // 清理工具名称中的链接标记
            const cleanName = toolName
              .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
              .trim();

            // 提取链接
            let toolLink = "";
            const linkMatch = toolName.match(/\[([^\]]+)\]\(([^)]+)\)/);
            if (linkMatch) {
              toolLink = linkMatch[2];
            }

            // 提取基础模型
            let toolModel = "";
            if (modelColIndex >= 0 && modelColIndex < row.length) {
              toolModel = row[modelColIndex];
            }

            // 提取相关信息（图标）
            let toolInfo = "";
            if (infoColIndex >= 0 && infoColIndex < row.length) {
              toolInfo = row[infoColIndex];
            }

            // 提取分享者（【@[name](url) 分享】等），并从描述中剥离
            const { sharers, cleanText: cleanDesc } =
              this.extractSharers(toolDesc);

            // 创建工具对象
            const tool = {
              id: this.allTools.length + 1,
              name: cleanName,
              description: cleanDesc,
              link: toolLink,
              model: toolModel,
              info: toolInfo,
              category: categoryName,
              badges: this.extractBadges(toolInfo),
              sharers: sharers,
            };

            categoryTools.push(tool);
            this.allTools.push(tool);
          });

          // 添加到分类
          this.categories.push({
            name: categoryName,
            tools: categoryTools,
          });
        }

        convertMarkdownLinks(text) {
          if (!text) return "";

          // 转换 Markdown 链接 [text](url) 为 HTML 链接 <a href="url">text</a>
          // 正则表达式解释：
          // \[([^\]]+)\] - 匹配 [文本]，捕获文本内容
          // \(([^)]+)\) - 匹配 (URL)，捕获URL内容
          const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;

          return text.replace(
            linkRegex,
            '<a href="$2" target="_blank" class="desc-link">$1</a>',
          );
        }

        // 从描述中提取分享者（【@[name](url) 分享】等多种变体），并从文本中剥离
        // 支持的变体：
        //   【[@name](url) 分享】/【@[name](url)分享】/【@[name](url)提供】
        //   【@[name](url)】（无动词）/【@name 分享】（纯文本无链接）
        //   异常未闭合行：【@[a](url) 中转站 【@[b](url)分享】（两个分享者都会被收集）
        extractSharers(text) {
          if (!text) return { sharers: [], cleanText: text || "" };

          const sharers = [];
          const seen = new Set();

          const addSharer = (name, url) => {
            let display = (name || "").trim();
            if (!display) return;
            if (!display.startsWith("@")) display = "@" + display;
            const key = display.toLowerCase();
            if (seen.has(key)) return; // 去重（不区分大小写）
            seen.add(key);
            sharers.push({ name: display, url: url || "" });
          };

          // 只匹配含 @ 的【…】分组，自动排除【AI 工具】等正文内容
          const cleanText = text.replace(
            /【([^】]*@[^】]*)】/g,
            (group, inner) => {
              // 优先提取 markdown 链接形式 [@name](url) / [name](url)
              const linkRegex = /\[(@?[^\]\s]+)\]\(([^)\s]+)\)/g;
              let m;
              let hasLink = false;
              while ((m = linkRegex.exec(inner)) !== null) {
                hasLink = true;
                addSharer(m[1], m[2]);
              }
              if (!hasLink) {
                // 纯文本形式 @name（如【@lixiaozhe.com 分享】）
                const plainRegex = /@([\w.\-]+)/g;
                while ((m = plainRegex.exec(inner)) !== null) {
                  addSharer("@" + m[1], "");
                }
              }
              return "";
            },
          );

          // 剥离后可能残留连续空格，压缩并清理首尾
          return {
            sharers,
            cleanText: cleanText.replace(/\s{2,}/g, " ").trim(),
          };
        }

        // 从相关信息中提取徽章
        extractBadges(info) {
          if (!info) return [];

          const badges = [];
          const badgeMap = {
            "🧪": { text: "测试阶段", type: "test", icon: "fas fa-flask" },
            "✈️": { text: "科学上网", type: "vpn", icon: "fas fa-plane" },
            "🆓": { text: "免费使用", type: "free", icon: "fas fa-gift" },
            "💰": { text: "付费使用", type: "paid", icon: "fas fa-coins" },
            "🔓": { text: "开源", type: "open-source", icon: "fas fa-unlock" },
            "📥": { text: "插件", type: "plugin", icon: "fas fa-puzzle-piece" },
            "📃": {
              text: "基于论文",
              type: "paper",
              icon: "fas fa-file-lines",
            },
          };

          // 检查每个图标
          for (const [icon, badgeInfo] of Object.entries(badgeMap)) {
            if (info.includes(icon)) {
              badges.push({
                icon: badgeInfo.icon,
                text: badgeInfo.text,
                type: badgeInfo.type,
              });
            }
          }

          // 处理组合情况
          if (info.includes("🆓&💰")) {
            badges.push({ icon: "🆓&💰", text: "免费+付费", type: "free" });
          }

          return badges;
        }

        // 渲染UI
        render() {
          this.renderCategoryTags();
          this.renderTools();
          this.updateStats();
        }

        // 渲染分类标签
        renderCategoryTags() {
          const container = document.getElementById("categoryTags");
          container.innerHTML = "";

          // 添加"全部"标签
          const allTag = document.createElement("div");
          allTag.className = `category-tag ${this.currentCategory === "all" ? "active" : ""}`;
          allTag.textContent = `全部 (${this.allTools.length})`;
          allTag.dataset.category = "all";
          allTag.addEventListener("click", () => this.filterByCategory("all"));
          container.appendChild(allTag);

          // 添加各分类标签
          this.categories.forEach((category) => {
            const tag = document.createElement("div");
            tag.className = `category-tag ${this.currentCategory === category.name ? "active" : ""}`;
            if (this.isFeaturedCategory(category.name)) {
              // 精选推荐：橘黄专属标签 + 皇冠图标
              tag.classList.add("featured-tag");
              tag.innerHTML = `<i class="fas fa-crown" aria-hidden="true"></i>${category.name} (${category.tools.length})`;
            } else {
              // 判断是否为二级分类（包含“-”）
              if (category.name.includes(" - ")) {
                tag.classList.add("subcategory");
              }
              tag.textContent = `${category.name} (${category.tools.length})`;
            }
            tag.dataset.category = category.name;
            tag.addEventListener("click", () =>
              this.filterByCategory(category.name),
            );
            container.appendChild(tag);
          });
        }

        // 构建分类区块头部（精选推荐使用橘黄专属样式）
        buildCategoryHeader(categoryName, count, isFeatured) {
          if (isFeatured) {
            return `
                            <div class="section-header">
                                <h2 class="section-title">
                                    <i class="fas fa-crown" aria-hidden="true"></i>
                                    ${categoryName}
                                </h2>
                                <div class="tools-count">${count} 个工具</div>
                            </div>`;
          }
          return `
                            <div class="section-header">
                                <h2 class="section-title">
                                    <i class="fas fa-folder"></i>
                                    ${categoryName}
                                </h2>
                                <div class="tools-count">${count} 个工具</div>
                            </div>`;
        }

        // 渲染工具卡片
        renderTools() {
          const container = document.getElementById("toolsContainer");

          // 过滤工具
          this.filteredTools = this.allTools.filter((tool) => {
            // 按分类过滤
            if (
              this.currentCategory !== "all" &&
              tool.category !== this.currentCategory
            ) {
              return false;
            }

            // 按搜索词过滤
            if (this.searchTerm) {
              const searchLower = this.searchTerm.toLowerCase();
              const nameMatch = tool.name.toLowerCase().includes(searchLower);
              const descMatch = tool.description
                .toLowerCase()
                .includes(searchLower);
              const modelMatch = tool.model.toLowerCase().includes(searchLower);
              const sharerMatch = (tool.sharers || []).some((s) =>
                s.name.toLowerCase().includes(searchLower),
              );
              return nameMatch || descMatch || modelMatch || sharerMatch;
            }

            return true;
          });

          if (this.filteredTools.length === 0) {
            container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h3>未找到匹配的工具</h3>
                            <p>请尝试其他搜索词或选择其他分类</p>
                        </div>
                    `;
            return;
          }

          // 按分类分组显示
          container.innerHTML = "";

          // 如果是"全部"分类，按原分类分组显示
          if (this.currentCategory === "all") {
            this.categories.forEach((category) => {
              // 获取该分类中经过过滤的工具
              const categoryFilteredTools = category.tools.filter((tool) => {
                if (this.searchTerm) {
                  const searchLower = this.searchTerm.toLowerCase();
                  const nameMatch = tool.name
                    .toLowerCase()
                    .includes(searchLower);
                  const descMatch = tool.description
                    .toLowerCase()
                    .includes(searchLower);
                  const modelMatch = tool.model
                    .toLowerCase()
                    .includes(searchLower);
                  const sharerMatch = (tool.sharers || []).some((s) =>
                    s.name.toLowerCase().includes(searchLower),
                  );
                  return nameMatch || descMatch || modelMatch || sharerMatch;
                }
                return true;
              });

              if (categoryFilteredTools.length === 0) return;

              const isFeatured = this.isFeaturedCategory(category.name);
              const section = document.createElement("div");
              section.className = isFeatured
                ? "tools-section featured-section"
                : "tools-section";
              const safeCategoryId = this.getSafeId(category.name);
              const featCount = isFeatured
                ? categoryFilteredTools.filter((t) => !this.isSponsorSlot(t))
                    .length
                : categoryFilteredTools.length;
              section.innerHTML = `
                            ${this.buildCategoryHeader(category.name, featCount, isFeatured)}
                            <div class="tools-grid" id="grid-${safeCategoryId}">
                                <!-- 工具卡片将在这里动态添加 -->
                            </div>
                        `;

              container.appendChild(section);

              // 添加工具卡片
              console.log(`正在渲染分类: "${category.name}"`); // 打印分类名
              console.log(`查找选择器: "#grid-${safeCategoryId}"`); // 打印实际的选择器
              const grid = section.querySelector(`#grid-${safeCategoryId}`);
              console.log(`找到的网格元素:`, grid); // 检查是否成功找到元素
              categoryFilteredTools.forEach((tool) => {
                grid.appendChild(this.createToolCard(tool));
              });
            });
          } else {
            // 显示单个分类
            const category = this.categories.find(
              (c) => c.name === this.currentCategory,
            );
            if (category) {
              const isFeatured = this.isFeaturedCategory(category.name);
              const section = document.createElement("div");
              section.className = isFeatured
                ? "tools-section featured-section"
                : "tools-section";
              const safeCategoryId = this.getSafeId(category.name);
              const featCount = isFeatured
                ? this.filteredTools.filter((t) => !this.isSponsorSlot(t))
                    .length
                : this.filteredTools.length;
              section.innerHTML = `
                            ${this.buildCategoryHeader(category.name, featCount, isFeatured)}
                            <div class="tools-grid" id="grid-${safeCategoryId}">
                                <!-- 工具卡片将在这里动态添加 -->
                            </div>
                        `;

              container.appendChild(section);

              // 添加工具卡片
              const grid = section.querySelector(`#grid-${safeCategoryId}`);
              this.filteredTools.forEach((tool) => {
                grid.appendChild(this.createToolCard(tool));
              });
            }
          }
        }

        // 创建工具卡片
        createToolCard(tool) {
          // 赞助商招租占位：走专属卡片
          if (this.isSponsorSlot(tool)) {
            return this.createSponsorCard(tool);
          }

          const isFeatured = this.isFeaturedCategory(tool.category);
          const card = document.createElement("div");
          card.className = isFeatured ? "tool-card featured" : "tool-card";
          card.dataset.id = tool.id;

          // 构建徽章HTML
          let badgesHtml = "";
          tool.badges.forEach((badge) => {
            badgesHtml += `<span class="badge ${badge.type}"><i class="${badge.icon}" aria-hidden="true"></i>${badge.text}</span>`;
          });

          // 构建链接HTML
          let linkHtml = "";
          if (tool.link) {
            linkHtml = `<a href="${tool.link}" target="_blank" class="tool-link"><i class="fas fa-external-link-alt"></i> 访问</a>`;
          } else {
            linkHtml =
              '<span class="tool-link"><i class="fas fa-exclamation-circle"></i> 无链接</span>';
          }

          // 构建模型HTML
          let modelHtml = "";
          if (tool.model) {
            modelHtml = `<div class="tool-model"><i class="fas fa-code-branch"></i> ${tool.model}</div>`;
          }

          // 构建分享者HTML（描述下方的胶囊标签，多分享者并列展示）
          let sharerHtml = "";
          if (tool.sharers && tool.sharers.length > 0) {
            const items = tool.sharers
              .map((s) => {
                // 展示时去掉 @ 前缀（数据层保留 @ 以兼容搜索）
                const displayName = s.name.replace(/^@/, "");
                return s.url
                  ? `<a href="${s.url}" target="_blank" rel="noopener">${displayName}</a>`
                  : `<strong>${displayName}</strong>`;
              })
              .join("");
            sharerHtml = `
                    <div class="tool-sharer" role="note" aria-label="分享者">
                        <i class="fas fa-share-nodes" aria-hidden="true"></i>
                        <span class="tool-sharer-label">分享者</span>
                        ${items}
                    </div>`;
          }

          // 精选推荐：剥离“推荐理由：”前缀，右上角加“推荐”标
          let descText = tool.description || "";
          if (isFeatured) {
            descText = descText.replace(/^推荐理由：\s*/, "");
          }
          const featuredPill = isFeatured
            ? `<span class="featured-pill"><i class="fas fa-star" aria-hidden="true"></i> 推荐</span>`
            : "";

          card.innerHTML = `
                    <div class="tool-header">
                        <div>
                            <h3 class="tool-name">${tool.name}</h3>
                            <div class="tool-badges">${badgesHtml}</div>
                        </div>
                        ${featuredPill}
                    </div>
                    <p class="tool-description">${this.convertMarkdownLinks(descText) || "暂无描述"}</p>
                    ${sharerHtml}
                    <div class="tool-footer">
                        ${modelHtml}
                        ${linkHtml}
                    </div>
                `;

          return card;
        }

        // 创建赞助商招租卡片（精选推荐栏目占位）
        createSponsorCard(tool) {
          const card = document.createElement("div");
          card.className = "tool-card featured sponsor-card";
          card.dataset.id = tool.id;
          card.innerHTML = `
                    <div class="sponsor-head">
                        <div class="sponsor-title">
                            <i class="fas fa-handshake" aria-hidden="true"></i>
                            赞助商招租
                        </div>
                        <span class="sponsor-tag">虚位以待</span>
                    </div>
                    <p class="sponsor-desc">这一格留给你的产品 —— 每天有做 AI 的人来挑工具。</p>
                    <div class="tool-footer">
                        <button type="button" class="sponsor-contact-btn">
                            <i class="fas fa-qrcode" aria-hidden="true"></i> 扫码联系
                        </button>
                    </div>
                `;
          // 点击弹出微信二维码
          const btn = card.querySelector(".sponsor-contact-btn");
          btn.addEventListener("click", () => this.showQrModal());
          return card;
        }

        // ===== 微信二维码弹窗（单例，惰性创建） =====
        ensureQrModal() {
          if (this._qrModal) return this._qrModal;

          const overlay = document.createElement("div");
          overlay.className = "qr-modal-overlay";
          overlay.innerHTML = `
                    <div class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
                        <button type="button" class="qr-modal-close" aria-label="关闭">
                            <i class="fas fa-xmark" aria-hidden="true"></i>
                        </button>
                        <h3 id="qrModalTitle" class="qr-modal-title">
                            <i class="fas fa-weixin" aria-hidden="true"></i> 微信扫一扫
                        </h3>
                        <img src="images/qr-code.png" alt="微信二维码" />
                        <p class="qr-modal-tip">扫码添加，洽谈赞助合作</p>
                    </div>
                `;

          // 关闭：右上角按钮、点击遮罩空白处
          overlay
            .querySelector(".qr-modal-close")
            .addEventListener("click", () => this.hideQrModal());
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) this.hideQrModal();
          });
          // 关闭：ESC（仅注册一次）
          document.addEventListener("keydown", (e) => {
            if (
              e.key === "Escape" &&
              this._qrModal.classList.contains("open")
            ) {
              this.hideQrModal();
            }
          });

          document.body.appendChild(overlay);
          this._qrModal = overlay;
          return overlay;
        }

        showQrModal() {
          const overlay = this.ensureQrModal();
          overlay.classList.add("open");
          // 打开后把焦点移到关闭按钮，便于键盘操作
          const closeBtn = overlay.querySelector(".qr-modal-close");
          if (closeBtn) closeBtn.focus();
        }

        hideQrModal() {
          if (this._qrModal) this._qrModal.classList.remove("open");
        }

        // 按分类过滤
        filterByCategory(category) {
          this.currentCategory = category;
          this.renderCategoryTags();
          this.renderTools();
          this.updateStats();
        }

        // 搜索工具
        searchTools(term) {
          this.searchTerm = term.toLowerCase();
          this.renderTools();
          this.updateStats();
        }

        // 更新统计信息
        updateStats() {
          document.getElementById("totalTools").textContent =
            this.filteredTools.length;
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        // ===== 主题切换 =====
        function toggleTheme() {
          const root = document.documentElement;
          const next =
            root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        }

        const themeToggle = document.getElementById("themeToggle");
        if (themeToggle) themeToggle.addEventListener("click", toggleTheme);

        // 用户未手动设置时，跟随系统主题变化
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", (e) => {
            let saved = null;
            try {
              saved = localStorage.getItem("theme");
            } catch (err) {}
            if (!saved) {
              document.documentElement.setAttribute(
                "data-theme",
                e.matches ? "dark" : "light",
              );
            }
          });

        // 回到顶部按钮
        const backToTop = document.querySelector(".back-to-top");
        if (backToTop) {
          const SHOW_AFTER = 400; // 滚动多少像素后显示
          let ticking = false;

          const toggleButton = () => {
            backToTop.classList.toggle("visible", window.scrollY > SHOW_AFTER);
            ticking = false;
          };

          // passive + rAF 节流，滚动不卡顿
          window.addEventListener(
            "scroll",
            () => {
              if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(toggleButton);
              }
            },
            { passive: true },
          );

          // 初始状态（例如刷新时已在中部）
          toggleButton();

          backToTop.addEventListener("click", () => {
            const reduce = window.matchMedia(
              "(prefers-reduced-motion: reduce)",
            ).matches;
            window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
          });
        }

        // 创建解析器实例
        const parser = new MarkdownToUI();

        // 从外部文件动态加载Markdown内容（数据源: data/tools.md）
        fetch("data/tools.md")
          .then((response) => {
            if (!response.ok) throw new Error("HTTP " + response.status);
            return response.text();
          })
          .then((markdownContent) => {
            parser.parseMarkdown(markdownContent);
            parser.render();
          })
          .catch((error) => {
            console.error("加载工具数据失败:", error);
            document.getElementById("toolsContainer").innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>数据加载失败</h3>
                            <p>请检查 data/tools.md 文件是否存在</p>
                        </div>
                    `;
          });

        // 设置搜索功能
        const searchInput = document.getElementById("searchInput");
        let searchTimeout;

        searchInput.addEventListener("input", function () {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            parser.searchTools(this.value);
          }, 300);
        });

        // 设置更新日期
        document.getElementById("updateDate").textContent = new Date()
          .toISOString()
          .split("T")[0];
      });
    </script>
    <!-- 回到顶部按钮 -->
    <button
      type="button"
      class="back-to-top"
      aria-label="回到顶部"
      title="回到顶部"
    >
      <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>
  </body>
</html>
